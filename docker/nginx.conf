# Apex -> www. Cloudflare terminates TLS at the edge and the tunnel forwards the
# original Host, so this block sees "proklinator.online" and sends the browser to
# the canonical hostname. The redirect target is absolute https:// because the
# origin itself is only ever spoken to over http inside the cluster.
server {
    listen 80;
    server_name proklinator.online;

    return 301 https://www.proklinator.online$request_uri;
}

# Everything else, including the container healthcheck (Host: 127.0.0.1).
server {
    listen 80 default_server;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}