<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Проклинатор - книга проклятий, которую читает агент</title>
    <meta
      name="description"
      content="Агент обучен на тёмных сводах: списках, что переписывали от руки, сетях без выхода наружу и книгах, которые жгли и не сожгли. Откройте главу, обведите нужное, остальное он сделает сам."
    />
    <meta name="theme-color" content="#120d0a" />
    <meta name="robots" content="index, follow" />

    <!-- Apex 301s to www (see docker/nginx.conf), so www is the canonical host. -->
    <link rel="canonical" href="https://www.proklinator.online/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Проклинатор" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:url" content="https://www.proklinator.online/" />
    <meta
      property="og:title"
      content="Проклинатор - книга проклятий, которую читает агент"
    />
    <meta
      property="og:description"
      content="Книга, которую листаете вы, а слово подбирает агент. Шесть глав: помрачение, разрыв, убывание, неспокойствие, наследие, обережное."
    />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Проклинатор - книга проклятий, которую читает агент"
    />
    <meta
      name="twitter:description"
      content="Книга, которую листаете вы, а слово подбирает агент. Шесть глав: помрачение, разрыв, убывание, неспокойствие, наследие, обережное."
    />

    <!-- Pre-paint mirror of src/lib/i18n.js: the stored choice, then the
         browser's own preference, then English. Applies the matching title,
         description and lang before first paint, so the tab, the link previews
         and the attribute speak the same language as the book; the app
         re-applies them whenever the reader switches language. -->
    <script>
      ;(function () {
        var LANG_KEY = 'proklinator.lang'
        var META = {
          ru: {
            lang: 'ru',
            locale: 'ru_RU',
            title: 'Проклинатор - книга проклятий, которую читает агент',
            description:
              'Агент обучен на тёмных сводах: списках, что переписывали от руки, сетях без выхода наружу и книгах, которые жгли и не сожгли. Откройте главу, обведите нужное, остальное он сделает сам.',
            ogTitle: 'Проклинатор - книга проклятий, которую читает агент',
            ogDescription:
              'Книга, которую листаете вы, а слово подбирает агент. Шесть глав: помрачение, разрыв, убывание, неспокойствие, наследие, обережное.',
          },
          en: {
            lang: 'en',
            locale: 'en_US',
            title: 'Proklinator - a book of curses read by an agent',
            description:
              'The agent is trained on dark ledgers: lists copied by hand, networks with no way out, and books that were burned and yet did not burn. Open a chapter, circle what you need - the rest it does itself.',
            ogTitle: 'Proklinator - a book of curses read by an agent',
            ogDescription:
              'A book you turn, while the agent picks the word. Six chapters: dimming, severing, waning, unrest, inheritance, warding.',
          },
        }

        var lang = null
        try {
          var stored = localStorage.getItem(LANG_KEY)
          if (stored === 'ru' || stored === 'en') lang = stored
        } catch (e) {
          // Storage unavailable: fall through to the browser preference.
        }
        if (!lang) {
          var prefs = navigator.languages || [navigator.language]
          for (var i = 0; i < prefs.length; i++) {
            var primary = String(prefs[i]).split('-')[0]
            if (primary === 'ru' || primary === 'en') {
              lang = primary
              break
            }
          }
        }
        lang = lang || 'en'
        var meta = META[lang]

        document.documentElement.lang = lang
        document.title = meta.title
        document
          .querySelector('meta[name="description"]')
          .setAttribute('content', meta.description)
        document
          .querySelector('meta[property="og:title"]')
          .setAttribute('content', meta.ogTitle)
        document
          .querySelector('meta[property="og:description"]')
          .setAttribute('content', meta.ogDescription)
        document
          .querySelector('meta[name="twitter:title"]')
          .setAttribute('content', meta.ogTitle)
        document
          .querySelector('meta[name="twitter:description"]')
          .setAttribute('content', meta.ogDescription)
        document
          .querySelector('meta[property="og:locale"]')
          .setAttribute('content', meta.locale)
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Old Standard TT - заголовки и рубрики книги, PT Serif - наборный текст
         страниц, IBM Plex Mono - технические подписи агента. Все три покрывают
         кириллицу; Cinzel и подобные её не имеют и молча падают в системный шрифт. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
